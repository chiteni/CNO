<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paddle Party</title><style>
*{box-sizing:border-box}body{margin:0;background:#fbf8f0;color:#172746;font-family:'Trebuchet MS',Arial,sans-serif;min-height:100vh;padding:22px;display:grid;place-items:center}main{width:min(1280px,100%);position:relative}header{display:grid;grid-template-columns:1fr 1.8fr 1fr;align-items:center;gap:30px;padding:8px 12% 18px}.score{border-radius:24px;text-align:center;padding:14px;background:#dff0ff;font-weight:900;letter-spacing:1px}.score.right{background:#ffe3df}.score strong{display:block;font-size:64px;line-height:1.1;color:#098ae9}.score.right strong{color:#ff625d}h1{font-family:'Arial Rounded MT Bold','Trebuchet MS',sans-serif;font-size:clamp(36px,5.4vw,76px);font-weight:1000;letter-spacing:-3px;line-height:.85;text-align:center;margin:0;transform:rotate(-3deg);color:#16a8f5;text-shadow:0 4px #0878ce,0 8px 0 #d9e8e9}h1 span{display:block;color:#ff7068;text-shadow:0 4px #df4947,0 8px 0 #f1e6dd;margin-top:9px}.new{position:absolute;right:0;top:0;border:2px solid #263c61;background:#fff;border-radius:16px;padding:10px 15px;color:#172746;font-weight:bold;cursor:pointer}.court{border:7px solid #425b7e;border-radius:28px;overflow:hidden;background:#0e1623;box-shadow:0 4px 0 #e1ddcf}canvas{display:block;width:100%;height:auto;outline:none}footer{display:flex;justify-content:space-between;align-items:center;gap:16px;border:2px solid #ebe1d0;border-radius:22px;padding:14px 22px;margin-top:16px}.controls{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:bold}.blue{color:#0089e9}.red{color:#ff645d}kbd{display:inline-grid;place-items:center;min-width:42px;height:44px;border:1px solid #d4d6df;border-bottom:4px solid #c9cbd5;border-radius:9px;background:#fff;font: bold 23px Arial;color:#152542}.serve{border:0;background:#ffd45d;border-radius:40px;padding:15px 25px;color:#172746;font:bold 18px 'Trebuchet MS';cursor:pointer;white-space:nowrap}.serve kbd{height:35px;font-size:18px;min-width:65px}.help{font-size:12px;color:#74819a;text-align:center;margin:12px 0 0}button:focus-visible{outline:3px solid #178ce9;outline-offset:4px}.touch{display:none;justify-content:space-between;margin-top:12px}.touch button{padding:16px 24px;border:0;border-radius:12px;background:#dff0ff;font-size:22px;touch-action:none}.touch .r button{background:#ffe3df}@media(pointer:coarse){.touch{display:flex}}@media(max-width:700px){body{padding:12px}header{gap:12px;padding:52px 0 20px}.score{font-size:11px;padding:10px}.score strong{font-size:40px}h1{letter-spacing:-2px}.new{font-size:12px;padding:8px}footer{padding:12px;flex-wrap:wrap;justify-content:center}.controls{font-size:11px;gap:5px}kbd{min-width:30px;height:34px}.serve{order:3;width:100%;font-size:16px}.court{border-width:5px;border-radius:20px}}
</style></head><body><main><button id="restart" class="new">↻ New match</button><header><div class="score">PLAYER 1<strong id="score1">0</strong></div><h1>Paddle<span>Party</span></h1><div class="score right">PLAYER 2<strong id="score2">0</strong></div></header><div class="court"><canvas id="canvas" width="1000" height="600" tabindex="0" aria-label="Paddle Party two player game"></canvas></div><footer><div class="controls blue">PLAYER 1 <kbd>W</kbd><kbd>S</kbd></div><button id="serve" class="serve">Press <kbd>SPACE</kbd> to serve</button><div class="controls red">PLAYER 2 <kbd>↑</kbd><kbd>↓</kbd></div></footer><p id="status" class="help" role="status" aria-live="polite">First to 5 wins · W/S and arrow keys to move · Space to serve</p><div class="touch"><div><button data-key="w" aria-label="Player 1 up">↑</button><button data-key="s" aria-label="Player 1 down">↓</button></div><div class="r"><button data-key="ArrowUp" aria-label="Player 2 up">↑</button><button data-key="ArrowDown" aria-label="Player 2 down">↓</button></div></div></main><script src="script/gameEngine.js"></script><script src="script/myCode.js"></script></body></html>
