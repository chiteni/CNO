<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f8fc">
  <meta name="description" content="Learn HTML step by step: discover each tag, watch a real example, practice with guidance, then build it yourself.">
  <title>Learn HTML &mdash; CNO</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%230d78ad'/%3E%3Cpath d='m15 12-8 8 8 8m10-16 8 8-8 8' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    :root{color-scheme:light;--ink:#172b40;--muted:#6f8194;--blue:#087eb5;--blue-dark:#075e8e;--green:#6a9b42;--line:#e2eaf1;--panel:#0d1724;--panel-2:#111f2e;--console:#101c29;--soft:#f5f8fc}
    *{box-sizing:border-box}
    body{margin:0;background:var(--soft);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
    button{font:inherit}
    .page{max-width:1180px;margin:0 auto;padding:28px 38px 60px}
    .chapter-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
    .back-link{color:var(--blue);text-decoration:none;font-size:13px;font-weight:650}
    .back-link:hover{text-decoration:underline}
    .chapter-jump{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
    .chapter-jump select{font:inherit;font-size:12px;padding:6px 8px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--ink)}
    .chapter-head{margin-bottom:18px}
    .eyebrow{display:flex;align-items:center;gap:6px;color:var(--blue);font-size:10px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
    .chapter-head h1{margin:0 0 6px;font-size:26px;letter-spacing:-.03em}
    .chapter-head p{margin:0;color:var(--muted);font-size:14px;max-width:640px;line-height:1.5}
    .stepper{list-style:none;display:flex;gap:6px;padding:0;margin:0 0 22px;flex-wrap:wrap}
    .stepper .dot{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px 6px 9px;font-size:11px;color:var(--muted);cursor:pointer}
    .stepper .dot>span{font-weight:650}
    .stepper .dot::before{content:attr(data-step);display:none}
    .stepper .dot{counter-reset:none}
    .stepper .dot{font-weight:700}
    .stepper .dot span{font-weight:600;color:inherit}
    .stepper .dot.active{border-color:var(--blue);background:#eaf6fc;color:var(--blue-dark)}
    .stepper .dot.done{border-color:#cfe3bb;background:#f2f9ec;color:#4f7a2f}
    .lesson-card{border:1px solid #dce5ec;background:#fff;border-radius:15px;box-shadow:0 14px 42px #24415c0d;padding:26px 28px;margin-bottom:20px}
    .card-heading{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin-bottom:12px}
    .teach-sentence{font-size:16px;line-height:1.5;margin:0 0 16px}
    .teach-extra{color:var(--muted);font-size:13px;line-height:1.6;margin-top:14px}
    .discover-grid,.watch-grid,.exercise-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
    .code-block{background:var(--panel);color:#d9e6f2;border-radius:10px;padding:18px 20px;font:13px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word;margin:0}
    .demo-code{font-size:15px}
    .part-open{color:#7bc8ee}
    .part-content{color:#f2d98a}
    .part-close{color:#ff9f8f}
    .legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);margin-top:12px}
    .swatch{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
    .swatch.part-open{background:#7bc8ee}
    .swatch.part-content{background:#f2d98a}
    .swatch.part-close{background:#ff9f8f}
    .preview-frame{display:block;width:100%;height:220px;border:1px solid var(--line);border-radius:10px;background:#fff}
    .annotation-chips,.tag-chip-row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
    .tag-chip{border:1px solid var(--line);background:#fff;color:#4b6275;border-radius:8px;padding:7px 12px;font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;cursor:pointer}
    .tag-chip:hover{border-color:#b7cadb}
    .tag-chip.active{border-color:var(--blue);background:#eaf6fc;color:var(--blue-dark)}
    .tag-chip.ok{border-color:#9bc77a;background:#f2f9ec;color:#4f7a2f}
    .tag-chip.bad{border-color:#f0a8a3;background:#fdf1f0;color:#b5433b}
    .tag-chip.static{cursor:default;background:#f5f8fc}
    .tag-chip.locked{opacity:.4;cursor:not-allowed}
    .tag-token{cursor:pointer;border-radius:3px;padding:0 1px}
    .tag-token:hover{background:#1c2f42}
    .tag-token.active{background:#0d78ad;color:#fff}
    .feedback{border-radius:10px;padding:12px 15px;font-size:13px;line-height:1.6;margin-top:14px}
    .feedback-ok{background:#f2f9ec;color:#4f7a2f;border:1px solid #cfe3bb}
    .feedback-error{background:#fdf1f0;color:#a5362e;border:1px solid #f0c7c2}
    .feedback-error ul{margin:6px 0 0;padding-left:18px}
    .feedback-info{background:#eaf6fc;color:#0a5d84;border:1px solid #cfe7f3}
    .level-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
    .level-tab{border:1px solid var(--line);background:#fff;color:#4b6275;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:650;cursor:pointer}
    .level-tab.active{border-color:var(--blue);background:var(--blue);color:#fff}
    .level-tab.locked{opacity:.4;cursor:not-allowed}
    .panel-label{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
    .exercise-code{width:100%;min-height:220px;resize:vertical;border:0;outline:0;border-radius:10px;padding:16px 18px;background:var(--panel);color:#d9e6f2;caret-color:#7bc8ee;font:13px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;tab-size:2}
    .exercise-actions{display:flex;gap:9px;margin-top:10px;flex-wrap:wrap}
    .button{border:1px solid var(--line);background:white;color:#4b6275;min-height:38px;padding:0 14px;border-radius:8px;font-size:12px;font-weight:650;cursor:pointer}
    .button:hover{background:#f7fafc;border-color:#c4d3df}
    .run{border:0;background:var(--blue);color:#fff;min-height:39px;padding:0 17px;border-radius:8px;font-size:13px;font-weight:750;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
    .run:hover{background:var(--blue-dark)}
    .run[disabled],.button[disabled]{opacity:.45;cursor:not-allowed}
    .hint-box{margin-top:10px;background:#fff8e6;border:1px solid #f2d98a;color:#7a5b06;border-radius:10px;padding:10px 14px;font-size:12px;line-height:1.7}
    .instructions{margin:0 0 16px;padding-left:20px;color:var(--ink);font-size:14px;line-height:1.7}
    .extra-challenge{margin-top:16px;font-size:12px;color:var(--muted)}
    .reference-panel{margin-bottom:14px}
    .correction-panel{margin-top:22px;border-top:1px dashed var(--line);padding-top:20px}
    .broken-code{border:1px solid #f0c7c2}
    .fixed-code{border:1px solid #cfe3bb}
    .completion-panel{text-align:left}
    .completion-summary{font-size:16px;line-height:1.6;margin:0 0 18px}
    .completion-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
    .chapter-footer-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
    .reset-btn{margin-left:auto}
    @media(max-width:760px){.page{padding:18px 16px 40px}.discover-grid,.watch-grid,.exercise-grid{grid-template-columns:1fr}.chapter-head h1{font-size:21px}}
  </style>
  <script src="../../common/common-menu.js" defer></script>
</head>
<body>
  <div class="page">
    <main>
      <div id="chapterChrome"></div>
      <div id="chapterBody"></div>
      <nav class="chapter-footer-nav" id="chapterFooterNav" aria-label="Chapter step navigation"></nav>
    </main>
  </div>
  <script src="../html-checker.js"></script>
  <script src="exercise-checker.js"></script>
  <script src="lessons-data.js"></script>
  <script src="lesson-engine.js"></script>
</body>
</html>
