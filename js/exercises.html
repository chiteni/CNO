<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JavaScript Practice | 18 Exercises</title><style>
:root{color-scheme:dark;--bg:#0b1120;--panel:#141e31;--border:#2a3953;--text:#eef4ff;--muted:#a8b7d0;--accent:#55d8c4;--blue:#80adff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,Segoe UI,Arial,sans-serif}header{padding:30px max(22px,calc((100vw - 1200px)/2));background:linear-gradient(115deg,#152640,#0c1728);border-bottom:1px solid var(--border)}h1{font-size:clamp(28px,4vw,42px);margin:0 0 6px}header p{margin:0;color:var(--muted)}.layout{max-width:1240px;margin:auto;display:grid;grid-template-columns:255px minmax(0,1fr);gap:24px;padding:24px}.sidebar{align-self:start;position:sticky;top:18px;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px}.sidebar h2{font-size:16px;margin:0 0 14px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{text-align:left;border:0;background:transparent;color:var(--muted);padding:9px 10px;border-radius:8px;cursor:pointer}.nav button.active,.nav button:hover{background:#263956;color:white}.controls{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}.controls input,.controls select{background:var(--panel);border:1px solid var(--border);border-radius:9px;color:white;padding:12px;font-size:15px}.controls input{flex:1;min-width:160px}.exercise{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:clamp(18px,3vw,30px);margin-bottom:20px;scroll-margin-top:20px}.tag{color:var(--accent);font-size:12px;font-weight:750;letter-spacing:.12em;text-transform:uppercase}.exercise h2{font-size:23px;margin:8px 0}.instruction{color:#d0dbec;margin:0 0 20px}.editor-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;color:var(--muted);font-size:13px}textarea{width:100%;min-height:155px;resize:vertical;background:#090f1c;color:#eaf4ff;border:1px solid #344562;border-radius:10px;padding:17px;font:15px/1.65 Consolas,'Courier New',monospace;tab-size:2}.buttons{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}button.action{background:var(--accent);color:#061a20;border:0;border-radius:9px;padding:10px 15px;font-weight:750;cursor:pointer}.secondary{background:#263750!important;color:#e5eeff!important}.output{white-space:pre-wrap;overflow-wrap:anywhere;background:#090f1c;border:1px solid #344562;border-radius:10px;padding:14px;min-height:49px;margin-top:10px;font:14px/1.6 Consolas,monospace}.output:empty:before{content:'Click Run code to see the output';color:#7588a7}.solution{display:none;margin-top:15px;border-top:1px solid var(--border);padding-top:14px}.solution.show{display:block}.solution pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0a1423;padding:15px;border-radius:10px;color:#cce7ff}.count{color:var(--muted);margin:0 0 14px}.empty{padding:30px;color:var(--muted)}footer{text-align:center;color:var(--muted);padding:28px}@media(max-width:760px){.layout{display:block;padding:14px}.sidebar{position:static;margin-bottom:18px}.nav{flex-direction:row;flex-wrap:wrap}.nav button{font-size:12px}header{padding:24px 18px}}
</style></head><body><header><h1>JavaScript Practice Lab</h1><p>18 distinct exercises · Variables · Output prediction · Debugging · Conditions</p></header><div class="layout"><aside class="sidebar"><h2>Exercise categories</h2><div class="nav" id="nav"></div><p style="font-size:13px;color:var(--muted)">Edit code, run it, and reveal the solution when ready. Everything works offline.</p></aside><main><div class="controls"><input id="search" placeholder="Search exercises…" aria-label="Search exercises"><select id="category" aria-label="Filter category"><option value="all">All categories</option></select></div><p class="count" id="count"></p><div id="exercises"></div></main></div><footer>CNO Technology Courses · JavaScript practice</footer><script>
const exercises=[{"number": 1, "category": "Variables", "title": "Store and display text", "instruction": "Create a variable called name and print its value.", "solution": "let name = \"Maya\";\nconsole.log(name);", "expected": "Maya", "starter": "let name = \"Maya\";\nconsole.log(name);"}, {"number": 2, "category": "Variables", "title": "Numbers in sentences", "instruction": "Store an age and display it inside a sentence.", "solution": "let age = 12;\nconsole.log(\"I am \" + age + \" years old.\");", "expected": "I am 12 years old.", "starter": "let age = 12;\nconsole.log(\"I am \" + age + \" years old.\");"}, {"number": 3, "category": "Variables", "title": "Update a score", "instruction": "Start with 5 points. Change the score to 8 and print it.", "solution": "let score = 5;\nscore = 8;\nconsole.log(score);", "expected": "8", "starter": "let score = 5;\nscore = 8;\nconsole.log(score);"}, {"number": 4, "category": "Variables", "title": "Calculate a total", "instruction": "Multiply a price of 4 by a quantity of 3.", "solution": "let price = 4;\nlet quantity = 3;\nlet total = price * quantity;\nconsole.log(total);", "expected": "12", "starter": "let price = 4;\nlet quantity = 3;\nlet total = price * quantity;\nconsole.log(total);"}, {"number": 5, "category": "Variables", "title": "Identify a data type", "instruction": "Find the type of a Boolean variable.", "solution": "let gameOver = false;\nconsole.log(typeof gameOver);", "expected": "boolean", "starter": "let gameOver = false;\nconsole.log(typeof gameOver);"}, {"number": 6, "category": "Predict The Output", "title": "Variable versus string", "instruction": "Explain why these two console statements differ.", "expected": "5\nstars", "starter": "let stars = 5;\nconsole.log(stars);\nconsole.log(\"stars\");", "solution": "let stars = 5;\nconsole.log(stars);\nconsole.log(\"stars\");"}, {"number": 7, "category": "Predict The Output", "title": "Copying a number", "instruction": "Does changing first also change second?", "expected": "20\n8", "starter": "let first = 8;\nlet second = first;\nfirst = 20;\nconsole.log(first);\nconsole.log(second);", "solution": "let first = 8;\nlet second = first;\nfirst = 20;\nconsole.log(first);\nconsole.log(second);"}, {"number": 8, "category": "Predict The Output", "title": "Number or text", "instruction": "Predict the results of adding to a number and a string.", "expected": "7\n52", "starter": "let number = 5;\nlet text = \"5\";\nconsole.log(number + 2);\nconsole.log(text + 2);", "solution": "let number = 5;\nlet text = \"5\";\nconsole.log(number + 2);\nconsole.log(text + 2);"}, {"number": 9, "category": "Track The Values", "title": "The hungry monster", "instruction": "Track cookies after eating, adding, and subtracting.", "solution": "let cookies = 12;\ncookies = cookies - 4;\ncookies = cookies + 2;\ncookies = cookies - cookies;\nconsole.log(cookies);", "expected": "0", "starter": "let cookies = 12;\ncookies = cookies - 4;\ncookies = cookies + 2;\ncookies = cookies - cookies;\nconsole.log(cookies);"}, {"number": 10, "category": "Track The Values", "title": "Swap two variables", "instruction": "Use a temporary variable to swap a and b.", "starter": "let a = 3;\nlet b = 9;\nlet temporary = a;\na = b;\nb = temporary;\nconsole.log(a);\nconsole.log(b);", "expected": "9\n3", "solution": "let a = 3;\nlet b = 9;\nlet temporary = a;\na = b;\nb = temporary;\nconsole.log(a);\nconsole.log(b);"}, {"number": 11, "category": "Fix The Mistakes", "title": "Robot introduction", "instruction": "Fix the quotation marks and variable-name mistakes.", "starter": "let robotName = Robo;\nlet battery = 100;\nconsole.log(robotname);\nconsole.log(batery);", "solution": "let robotName = \"Robo\";\nlet battery = 100;\nconsole.log(robotName);\nconsole.log(battery);"}, {"number": 12, "category": "Fix The Mistakes", "title": "Update the score", "instruction": "Correct the repeated let declaration.", "starter": "let score = 10;\nlet score = score + 5;\nconsole.log(score);", "solution": "let score = 10;\nscore = score + 5;\nconsole.log(score); // 15"}, {"number": 13, "category": "Conditions", "title": "Pass or fail", "instruction": "Print Pass for grades of 50 or higher; otherwise print Fail.", "solution": "let grade = 75;\nif (grade >= 50) {\n  console.log(\"Pass.\");\n} else {\n  console.log(\"Fail.\");\n}", "expected": "Pass.", "starter": "let grade = 75;\nif (grade >= 50) {\n  console.log(\"Pass.\");\n} else {\n  console.log(\"Fail.\");\n}"}, {"number": 14, "category": "Conditions", "title": "Find the larger number", "instruction": "Compare two numbers; also handle equality.", "solution": "let first = 8;\nlet second = 3;\nif (first > second) {\n  console.log(\"Larger: \" + first);\n} else if (second > first) {\n  console.log(\"Larger: \" + second);\n} else {\n  console.log(\"Equal.\");\n}", "expected": "Larger: 8", "starter": "let first = 8;\nlet second = 3;\nif (first > second) {\n  console.log(\"Larger: \" + first);\n} else if (second > first) {\n  console.log(\"Larger: \" + second);\n} else {\n  console.log(\"Equal.\");\n}"}, {"number": 15, "category": "Conditions", "title": "Check divisibility", "instruction": "Test whether a number is divisible by 5.", "solution": "let number = 10;\nif (number % 5 === 0) {\n  console.log(\"Divisible by 5.\");\n} else {\n  console.log(\"Not divisible by 5.\");\n}", "expected": "Divisible by 5.", "starter": "let number = 10;\nif (number % 5 === 0) {\n  console.log(\"Divisible by 5.\");\n} else {\n  console.log(\"Not divisible by 5.\");\n}"}, {"number": 16, "category": "Conditions", "title": "Check a range", "instruction": "Test whether a number is between 10 and 20 inclusive.", "solution": "let number = 15;\nif (number >= 10 && number <= 20) {\n  console.log(\"Inside the range.\");\n} else {\n  console.log(\"Outside the range.\");\n}", "expected": "Inside the range.", "starter": "let number = 15;\nif (number >= 10 && number <= 20) {\n  console.log(\"Inside the range.\");\n} else {\n  console.log(\"Outside the range.\");\n}"}, {"number": 17, "category": "Conditions", "title": "Percentage discount", "instruction": "Apply a 10% discount for amounts of at least $100.", "solution": "let amount = 150;\nlet discount = 0;\nif (amount >= 100) {\n  discount = amount * 0.10;\n}\nlet final = amount - discount;\nconsole.log(final);", "expected": "135", "starter": "let amount = 150;\nlet discount = 0;\nif (amount >= 100) {\n  discount = amount * 0.10;\n}\nlet final = amount - discount;\nconsole.log(final);"}, {"number": 18, "category": "Conditions", "title": "Validate a grade", "instruction": "Reject grades outside 0–100; otherwise print Pass or Fail.", "solution": "let grade = 75;\nif (grade < 0 || grade > 100) {\n  console.log(\"Invalid grade.\");\n} else if (grade >= 50) {\n  console.log(\"Pass.\");\n} else {\n  console.log(\"Fail.\");\n}", "expected": "Pass.", "starter": "let grade = 75;\nif (grade < 0 || grade > 100) {\n  console.log(\"Invalid grade.\");\n} else if (grade >= 50) {\n  console.log(\"Pass.\");\n} else {\n  console.log(\"Fail.\");\n}"}];
const categories=[...new Set(exercises.map(x=>x.category))];
const nav=document.getElementById('nav'),sel=document.getElementById('category'),list=document.getElementById('exercises');
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
for(const c of categories){const o=document.createElement('option');o.value=c;o.textContent=c;sel.append(o)}
function render(){const term=document.getElementById('search').value.toLowerCase(),cat=sel.value;const found=exercises.filter(x=>(cat==='all'||x.category===cat)&&[x.title,x.instruction,x.category,String(x.number)].join(' ').toLowerCase().includes(term));document.getElementById('count').textContent=`Showing ${found.length} of ${exercises.length} exercises`;
list.innerHTML=found.map(x=>`<section class="exercise" id="exercise-${x.number}"><div class="tag">${escapeHTML(x.category)} · Exercise ${x.number}</div><h2>${escapeHTML(x.title)}</h2><p class="instruction">${escapeHTML(x.instruction)}</p><div class="editor-head"><strong>JavaScript editor</strong><span>Edit the code below</span></div><textarea spellcheck="false" aria-label="Code for exercise ${x.number}" id="code-${x.number}">${escapeHTML(x.starter)}</textarea><div class="buttons"><button class="action" onclick="runCode(${x.number})">▶ Run code</button><button class="action secondary" onclick="toggleSolution(${x.number})">Show / hide solution</button><button class="action secondary" onclick="resetCode(${x.number})">Reset</button></div><div class="output" id="output-${x.number}" aria-live="polite"></div><div class="solution" id="solution-${x.number}"><strong>Solution</strong><pre>${escapeHTML(x.solution)}</pre>${x.expected?`<p><strong>Expected output:</strong> ${escapeHTML(x.expected)}</p>`:''}</div></section>`).join('')||'<p class="empty">No exercises found.</p>';
nav.innerHTML=categories.map(c=>`<button onclick="selectCategory('${c.replace(/'/g,"\\'")}')" class="${cat===c?'active':''}">${escapeHTML(c)} (${exercises.filter(x=>x.category===c).length})</button>`).join('');}
function selectCategory(c){sel.value=c;render();window.scrollTo({top:0,behavior:'smooth'})}
function toggleSolution(n){document.getElementById('solution-'+n).classList.toggle('show')}
function resetCode(n){document.getElementById('code-'+n).value=exercises.find(x=>x.number===n).starter;document.getElementById('output-'+n).textContent=''}
// Run each snippet in an isolated sandboxed iframe, with no network permissions.
function runCode(n){const code=document.getElementById('code-'+n).value,out=document.getElementById('output-'+n);out.textContent='Running…';const frame=document.createElement('iframe');frame.setAttribute('sandbox','allow-scripts');frame.style.display='none';const id='exercise-'+n+'-'+Math.random().toString(36).slice(2);const listener=e=>{if(e.source!==frame.contentWindow||!e.data||e.data.id!==id)return;window.removeEventListener('message',listener);out.textContent=e.data.lines.join('\n')||'(No console output)';frame.remove()};window.addEventListener('message',listener);const script=`const lines=[];const print=(...a)=>lines.push(a.map(v=>typeof v==='object'?JSON.stringify(v):String(v)).join(' '));try{new Function('console',${JSON.stringify(code)})({log:print,warn:print,error:print});}catch(e){print(e.name+': '+e.message)}parent.postMessage({id:${JSON.stringify(id)},lines},'*');`;frame.srcdoc='<scr'+'ipt>'+script+'</scr'+'ipt>';document.body.append(frame);setTimeout(()=>{if(frame.isConnected){window.removeEventListener('message',listener);out.textContent='Execution timed out or was blocked.';frame.remove()}},2500)}
document.getElementById('search').addEventListener('input',render);sel.addEventListener('change',render);render();
</script></body></html>
